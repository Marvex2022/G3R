[project]
name = "g3r-repro"
version = "0.1.0"
description = "Paper-faithful reimplementation scaffold for G3R: Gradient Guided Generalizable Reconstruction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "scipy>=1.10",
  "plyfile>=1.0",
  "lpips>=0.1.4",
  "gsplat>=1.4",
]

[tool.setuptools]
packages = ["g3r"]
